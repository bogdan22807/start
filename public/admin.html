<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Статистика</title>
  <style>
    :root {
      --bg: #FFFAF6;
      --card: #fff;
      --line: #E6E6E6;
      --text: #111111;
      --muted: #8E8E93;
      --label: #9A948E;
      --blue: #1B86EE;
      --gold: #FACE13;
      --soft: #7EBAFF;
      --idle: #4A4A4E;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000;
      --card: #161616;
      --line: #2c2c2e;
      --text: #f4f4f5;
      --muted: #a1a1a6;
      --label: #8e8e93;
      --idle: #d0d0d4;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100dvh;
      font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .app {
      width: min(100%, 440px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      background:
        radial-gradient(160px 100px at 18% 72px, rgba(250, 206, 19, 0.2), transparent 72%),
        var(--bg);
    }
    .top { display: flex; align-items: center; gap: 10px; }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.05;
      font-weight: 760;
      letter-spacing: -0.045em;
    }
    .badge {
      width: 42px;
      height: 42px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 18px rgba(196, 156, 40, 0.16), 0 0 0 1px rgba(17, 17, 17, 0.04);
    }
    .badge svg { width: 22px; height: 22px; }
    #theme {
      margin-left: auto;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 0 0 1px rgba(17, 17, 17, 0.045);
    }
    #theme svg { width: 18px; height: 18px; grid-area: 1 / 1; }
    html[data-theme="dark"] #theme .moon,
    html[data-theme="light"] #theme .sun { display: none; }
    .metrics { display: grid; gap: 8px; margin-top: 18px; }
    .metric {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 72px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.05);
    }
    .metric .ico { width: 32px; height: 32px; flex: none; }
    .metric span {
      color: var(--label);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .metric strong {
      margin-left: auto;
      font-size: 26px;
      line-height: 1;
      font-weight: 760;
      letter-spacing: -0.04em;
    }
    .metric em { font-style: normal; color: var(--muted); font-size: 13px; font-weight: 650; }
    .status, .lock {
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card);
      color: var(--muted);
      box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.05);
    }
    .lock { color: var(--text); font-weight: 650; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="star" viewBox="0 0 64 64">
      <path fill="#FACE13" d="M32 4.2 39.6 20.8 57.4 22.6 44.2 34.4 48 51.8 32 43.2 16 51.8 19.8 34.4 6.6 22.6 24.4 20.8Z"/>
      <path fill="#fff" fill-opacity=".5" d="M32 12.2 35.2 19.4 37.4 19.8 33.2 23.8 34.2 26.4 32 24.6 29.8 26.4 30.6 23.6 26.8 20.2 29.4 19.6Z"/>
    </symbol>
    <symbol id="gem" viewBox="0 0 64 64">
      <path fill="#1B86EE" d="M32 6 54 26 32 58 10 26Z"/>
      <path fill="#fff" fill-opacity=".72" d="M32 6 44 26 32 18 20 26Z"/>
      <path fill="#0E5EAE" fill-opacity=".35" d="M32 58 10 26h22Z"/>
    </symbol>
    <symbol id="user" viewBox="0 0 64 64">
      <circle cx="32" cy="22" r="12" fill="#1B86EE"/>
      <path fill="#7EBAFF" d="M12 54c2.4-12 10-18 20-18s17.6 6 20 18Z"/>
    </symbol>
  </svg>
  <main class="app">
    <div class="top">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 64 64"><use href="#star"/></svg>
      </div>
      <h1>Статистика</h1>
      <button type="button" id="theme" aria-label="Включить светлую тему">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 3.1v2M12 18.9v2M3.1 12h2M18.9 12h2M5.7 5.7l1.4 1.4M16.9 16.9l1.4 1.4M18.3 5.7l-1.4 1.4M7.1 16.9l-1.4 1.4"/>
          </g>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M14.6 3.2a7.2 7.2 0 1 0 5.7 11.7A5.9 5.9 0 0 1 14.6 3.2z"/>
        </svg>
      </button>
    </div>
    <p class="status" id="status">Считаю…</p>
    <p class="lock" id="lock" hidden></p>
    <section id="panel" hidden>
      <div class="metrics">
        <div class="metric"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><use href="#user"/></svg><span>Пользователи</span><strong id="users">0</strong></div>
        <div class="metric"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><use href="#gem"/></svg><span>Заказы</span><strong id="orders">0</strong></div>
        <div class="metric"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><use href="#star"/></svg><span>Сумма</span><strong id="sum">0.00 <em>USDT</em></strong></div>
      </div>
    </section>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const THEME_KEY = "shop-bg";
    const tg = window.Telegram && window.Telegram.WebApp;
    const status = document.getElementById("status");
    const lock = document.getElementById("lock");
    const panel = document.getElementById("panel");

    function paintChrome(color) {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", color);
      if (!tg) return;
      ["setHeaderColor", "setBackgroundColor", "setBottomBarColor"].forEach((name) => {
        if (typeof tg[name] === "function") {
          try { tg[name](color); } catch (error) {}
        }
      });
    }

    function applyTheme(theme) {
      const dark = theme === "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      document.getElementById("theme").setAttribute("aria-label", dark ? "Включить светлую тему" : "Включить тёмную тему");
      paintChrome(dark ? "#000000" : "#FFFAF6");
      try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (error) {}
    }

    function numberText(value) {
      return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function moneyValue(value) {
      const text = String(value || "0.00").replace(/\s/g, "");
      const negative = text.startsWith("-");
      const [whole, frac] = (negative ? text.slice(1) : text).split(".");
      return (negative ? "−" : "") + numberText(whole || "0") + "." + (frac || "00");
    }

    function show(data) {
      document.getElementById("users").textContent = numberText(data.users);
      document.getElementById("orders").textContent = numberText(data.orders);
      document.getElementById("sum").innerHTML = moneyValue(data.sum) + ' <em>USDT</em>';
    }

    document.getElementById("theme").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });

    if (tg) {
      tg.ready();
      tg.expand();
      if (typeof tg.disableVerticalSwipes === "function") {
        try { tg.disableVerticalSwipes(); } catch (error) {}
      }
    }
    let savedTheme = "dark";
    try { savedTheme = localStorage.getItem(THEME_KEY) || "dark"; } catch (error) {}
    applyTheme(savedTheme);

    const params = new URLSearchParams(location.search);
    const hash = location.hash.startsWith("#") ? location.hash.slice(1) : "";
    const snapshot = hash || params.get("s") || "";
    const initData = tg && tg.initData ? tg.initData : "";
    fetch("/api/stat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({init_data: initData, snapshot})
    }).then(async (response) => {
      const body = await response.json().catch(() => ({}));
      if (response.status === 403) {
        status.hidden = true;
        lock.hidden = false;
        lock.textContent = body.message || "Эта панель только для администратора.";
        return;
      }
      if (!response.ok || !body.periods) {
        status.textContent = body.message || "Не удалось посчитать статистику.";
        return;
      }
      status.hidden = true;
      panel.hidden = false;
      show(body.periods.all);
    }).catch(() => {
      status.textContent = "Нет связи с магазином.";
    });
  </script>
</body>
</html>
