<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Магазин</title>
  <style>
    :root {
      --bg: #FFFAF6;
      --card: #fff;
      --line: #E6E6E6;
      --text: #111111;
      --muted: #8E8E93;
      --label: #9A948E;
      --blue: #1B86EE;
      --gold: #FACE13;
      --fade: rgba(255, 250, 246, 0);
      --idle: #4A4A4E;
      --placeholder: #C5C5C7;
      --avatar: #E3E3E5;
      --pay-off: #E6E6E8;
      --pay-off-text: #A0A0A4;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #000000;
      --card: #161616;
      --line: #2c2c2e;
      --text: #f4f4f5;
      --muted: #a1a1a6;
      --label: #8e8e93;
      --fade: rgba(0, 0, 0, 0);
      --idle: #d0d0d4;
      --placeholder: #6e6e72;
      --avatar: #2a2a2e;
      --pay-off: #2a2a2e;
      --pay-off-text: #6e6e72;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100dvh;
      font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .app {
      width: min(100%, 440px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
      background:
        radial-gradient(140px 90px at 16% 78px, rgba(250, 206, 19, 0.22), transparent 72%),
        var(--bg);
    }
    body.premium .app {
      background:
        radial-gradient(140px 90px at 16% 78px, rgba(27, 134, 238, 0.16), transparent 72%),
        var(--bg);
    }
    .switch {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 0 0 1px rgba(17, 17, 17, 0.045);
    }
    .pill {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      border-radius: 14px;
      background: var(--blue);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1);
    }
    .switch.alt .pill { transform: translateX(100%); }
    .top { display: flex; align-items: center; gap: 10px; }
    .top .switch { flex: 1; }
    #theme {
      width: 50px;
      height: 50px;
      flex: none;
      display: grid;
      place-items: center;
      padding: 0;
      line-height: 0;
      border-radius: 18px;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 0 0 1px rgba(17, 17, 17, 0.045);
    }
    #theme svg {
      grid-area: 1 / 1;
      width: 22px;
      height: 22px;
      display: block;
    }
    html[data-theme="dark"] #theme .moon,
    html[data-theme="light"] #theme .sun { display: none; }
    .switch button {
      position: relative;
      z-index: 1;
      height: 42px;
      border-radius: 14px;
      color: var(--idle);
      font-weight: 650;
    }
    .switch button.on { color: #fff; }
    .hero {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 2px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: -0.04em;
    }
    .badge {
      position: relative;
      width: 48px;
      height: 48px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--card);
      box-shadow: 0 8px 18px rgba(196, 156, 40, 0.16), 0 0 0 1px rgba(17, 17, 17, 0.04);
    }
    body.premium .badge { box-shadow: 0 8px 18px rgba(27, 134, 238, 0.16), 0 0 0 1px rgba(17, 17, 17, 0.04); }
    .badge-ico { width: 30px; height: 30px; animation: float 2.8s ease-in-out infinite; }
    .spark {
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--gold);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      animation: spark 2.2s ease-in-out infinite;
    }
    body.premium .spark { background: #7EBAFF; }
    .s1 { top: -3px; right: -3px; }
    .s2 { left: -4px; bottom: 1px; width: 5px; height: 5px; animation-delay: .7s; }
    .label {
      margin: 18px 2px 8px;
      color: var(--label);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .who { margin-top: 2px; }
    .profile, .field, .card, .plan {
      background: var(--card);
      border: 2px solid transparent;
      box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.05);
    }
    .profile {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      animation: rise .4s both;
    }
    .avatar {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--avatar);
      color: #3A3A3C;
      font-weight: 700;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-weight: 680; }
    .handle, .sub, .price { color: var(--muted); }
    .handle, .sub { font-size: 14px; }
    .field {
      width: 100%;
      margin-top: 12px;
      padding: 16px 16px;
      border-radius: 18px;
      border: 2px solid transparent;
      box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.05);
    }
    .field::placeholder { color: var(--placeholder); }
    .field:focus { outline: none; border-color: var(--blue); box-shadow: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .plans { display: grid; gap: 10px; }
    .card, .plan {
      border-radius: 18px;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
      animation: rise .42s both;
    }
    .card:nth-child(2), .plan:nth-child(2) { animation-delay: .04s; }
    .card:nth-child(3), .plan:nth-child(3) { animation-delay: .08s; }
    .card:nth-child(4) { animation-delay: .12s; }
    .card:nth-child(5) { animation-delay: .16s; }
    .card:nth-child(6) { animation-delay: .2s; }
    .card { min-height: 84px; padding: 14px 6px 12px; text-align: center; }
    .card:active, .plan:active, #pay:active:not(:disabled) { transform: scale(0.97); }
    .card.on, .plan.on {
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(27, 134, 238, 0.12);
    }
    .qty {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 18px;
      font-weight: 760;
      letter-spacing: -0.03em;
    }
    .card .ico { width: 16px; height: 16px; }
    .card.on .ico { animation: pop .4s cubic-bezier(.2, .8, .2, 1); }
    .price { margin-top: 6px; font-size: 13px; }
    .plan {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      text-align: left;
    }
    .plan .ico { width: 28px; height: 28px; flex: none; }
    .plan .name { display: block; font-weight: 700; }
    .plan .sum { margin-left: auto; font-weight: 760; letter-spacing: -0.03em; }
    .custom { display: block; margin-top: 12px; color: var(--muted); font-size: 15px; }
    [hidden] { display: none !important; }
    .checkout {
      position: sticky;
      bottom: 0;
      margin: 8px -16px 0;
      padding: 8px 16px 4px;
      background: linear-gradient(to top, var(--bg) 78%, var(--fade));
    }
    .due {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 8px 2px 12px;
      font-size: 16px;
    }
    .due strong { font-weight: 760; letter-spacing: -0.03em; }
    .due strong.tick { animation: pop .35s cubic-bezier(.2, .8, .2, 1); }
    #pay {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 54px;
      border-radius: 16px;
      background: var(--blue);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 10px 22px rgba(27, 134, 238, 0.28);
    }
    #pay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 32%, rgba(255, 255, 255, 0.38) 50%, transparent 68%);
      transform: translateX(-130%);
      animation: shine 3.4s ease-in-out infinite;
    }
    #pay:disabled {
      background: var(--pay-off);
      color: var(--pay-off-text);
      box-shadow: none;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 40px;
      padding: 0 4px;
      color: var(--blue);
      font-weight: 700;
    }
    .method {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 2px solid transparent;
      background: var(--card);
      box-shadow: 0 0 0 1px rgba(17, 17, 17, 0.05);
      text-align: left;
    }
    .method .ico { width: 32px; height: 32px; flex: none; object-fit: contain; }
    .method .ico.card { width: 52px; height: 34px; }
    .method .ico.heleket { width: 24px; height: 28px; }
    .method .name { display: block; font-weight: 700; }
    .method .sub { display: block; }
    .method.on {
      border-color: var(--blue);
      box-shadow: 0 8px 20px rgba(27, 134, 238, 0.12);
    }
    #paywall .label:first-of-type { margin-top: 8px; }
    .summary {
      margin: 14px 2px 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    #pay:disabled::after { display: none; }
    .burst { position: relative; height: 0; }
    .burst i {
      position: absolute;
      left: 50%;
      top: 8px;
      width: 10px;
      height: 10px;
      background: var(--gold);
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: fly .75s ease-out forwards;
    }
    .note {
      min-height: 0;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .note.show { animation: rise .35s both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-2px) rotate(-8deg) scale(1.08); }
    }
    @keyframes spark {
      0%, 100% { opacity: .35; transform: scale(.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    @keyframes pop {
      0% { transform: scale(.92); }
      55% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes shine {
      0%, 55% { transform: translateX(-130%); }
      100% { transform: translateX(130%); }
    }
    @keyframes fly {
      to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

  <svg class="sprite" aria-hidden="true">
    <symbol id="star" viewBox="0 0 64 64">
      <path fill="#FACE13" d="M32 4.2 39.6 20.8 57.4 22.6 44.2 34.4 48 51.8 32 43.2 16 51.8 19.8 34.4 6.6 22.6 24.4 20.8Z"/>
      <path fill="#fff" fill-opacity=".5" d="M32 12.2 35.2 19.4 37.4 19.8 33.2 23.8 34.2 26.4 32 24.6 29.8 26.4 30.6 23.6 26.8 20.2 29.4 19.6Z"/>
    </symbol>
    <symbol id="gem" viewBox="0 0 64 64">
      <path fill="#1B86EE" d="M32 6 54 26 32 58 10 26Z"/>
      <path fill="#fff" fill-opacity=".72" d="M32 6 44 26 32 18 20 26Z"/>
      <path fill="#0E5EAE" fill-opacity=".35" d="M32 58 10 26h22Z"/>
    </symbol>
  </svg>
  <main class="app" id="app">
    <div class="top">
      <div class="switch" id="product">
        <span class="pill"></span>
        <button type="button" data-product="stars" class="on">Звёзды</button>
        <button type="button" data-product="premium">Premium</button>
      </div>
      <button type="button" id="theme" aria-label="Включить светлую тему">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 3.1v2M12 18.9v2M3.1 12h2M18.9 12h2M5.7 5.7l1.4 1.4M16.9 16.9l1.4 1.4M18.3 5.7l-1.4 1.4M7.1 16.9l-1.4 1.4"/>
          </g>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M14.6 3.2a7.2 7.2 0 1 0 5.7 11.7A5.9 5.9 0 0 1 14.6 3.2z"/>
        </svg>
      </button>
    </div>
    <header class="hero">
      <div class="badge" id="badge"></div>
      <h1 id="title">Telegram Stars</h1>
    </header>
    <div id="stage">
      <p class="label">Получатель</p>
      <div class="switch who" id="who">
        <span class="pill"></span>
        <button type="button" data-who="self" class="on">Себе</button>
        <button type="button" data-who="friend">Другу</button>
      </div>
      <div id="recipient"></div>
      <p class="label" id="section">Количество</p>
      <div id="choices"></div>
      <label class="custom" id="customLabel">Другое количество
        <input class="field" id="custom" inputmode="numeric" placeholder="от 50 до 100 000" autocomplete="off">
      </label>
    </div>
    <section id="paywall" hidden>
      <button type="button" class="back" id="back">← Назад</button>
      <p class="summary" id="summary"></p>
      <p class="label">Банковская карта</p>
      <button type="button" class="method" data-pay="card">
        <svg class="ico card" viewBox="0 0 72 46" aria-hidden="true">
          <defs>
            <linearGradient id="cardSheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2c2c30"/>
              <stop offset="0.42" stop-color="#101012"/>
              <stop offset="1" stop-color="#000"/>
            </linearGradient>
          </defs>
          <rect x="1.2" y="1.2" width="69.6" height="43.6" rx="7" fill="url(#cardSheen)" stroke="#e6e6ea" stroke-width="1.6"/>
          <rect x="8" y="14" width="14" height="11" rx="2" fill="#f3ead4"/>
          <path d="M8 17.6h14M11.5 14v11M15.2 14v11" stroke="#8a8376" stroke-width="0.8"/>
          <circle cx="57.5" cy="30" r="6.4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
          <circle cx="50.4" cy="30" r="6.4" fill="none" stroke="#bdbdc2" stroke-width="1.5"/>
        </svg>
        <span><span class="name">Банковская карта</span><span class="sub">Visa · только из Украины</span></span>
      </button>
      <p class="label">Криптой</p>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const PACKS = [
      { amount: 50, price: "0.94" },
      { amount: 100, price: "1.88" },
      { amount: 250, price: "4.69" },
      { amount: 500, price: "9.38" },
      { amount: 1000, price: "18.75" },
      { amount: 2500, price: "46.88" }
    ];
    const PLANS = [
      { months: 3, total: "14.99", per: "5.00" },
      { months: 6, total: "19.99", per: "3.33" },
      { months: 12, total: "36.24", per: "3.02" }
    ];
    const STAR_MIN = 50;
    const STAR_MAX = 100000;
    const state = { product: "stars", who: "self", pack: 1000, months: 12, custom: "" };
    const tg = window.Telegram && window.Telegram.WebApp;
    const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};

    const THEME_KEY = "shop-bg";
    const PAY_NAMES = { card: "Банковская карта", cryptobot: "Crypto Bot", heleket: "Heleket" };

    function paintChrome(color) {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", color);
      if (!tg) return;
      ["setHeaderColor", "setBackgroundColor", "setBottomBarColor"].forEach((name) => {
        if (typeof tg[name] === "function") {
          try { tg[name](color); } catch (error) {}
        }
      });
    }

    function applyTheme(theme) {
      const dark = theme === "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      document.getElementById("theme").setAttribute("aria-label", dark ? "Включить светлую тему" : "Включить тёмную тему");
      paintChrome(dark ? "#000000" : "#FFFAF6");
      try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (error) {}
    }

    if (tg) {
      tg.ready();
      tg.expand();
    }
    let savedTheme = "dark";
    try { savedTheme = localStorage.getItem(THEME_KEY) || "dark"; } catch (error) {}
    applyTheme(savedTheme);

    const title = document.getElementById("title");
    const badge = document.getElementById("badge");
    const section = document.getElementById("section");
    const choices = document.getElementById("choices");
    const recipient = document.getElementById("recipient");
    const customLabel = document.getElementById("customLabel");
    const custom = document.getElementById("custom");
    const due = document.getElementById("due");
    const pay = document.getElementById("pay");
    const note = document.getElementById("note");
    const stage = document.getElementById("stage");
    const checkout = document.querySelector(".checkout");
    const paywall = document.getElementById("paywall");
    const summary = document.getElementById("summary");
    const paynote = document.getElementById("paynote");
    let shownProduct = "";
    let shownWho = "";

    function icon(id, className) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", className);
      svg.setAttribute("viewBox", "0 0 64 64");
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#" + id);
      svg.appendChild(use);
      return svg;
    }

    function money(cents) {
      return (cents / 100).toFixed(2);
    }

    function formatQty(amount) {
      return String(amount).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function starCents(amount) {
      const known = PACKS.find((pack) => pack.amount === amount);
      if (known) return Math.round(Number(known.price) * 100);
      return Math.round(amount * 1.875);
    }

    function friendName() {
      const field = document.getElementById("friendName");
      return field ? field.value.trim().replace(/^@/, "") : "";
    }

    function currentAmount() {
      if (state.custom.trim()) {
        const digits = state.custom.replace(/\D/g, "");
        return digits ? Number(digits) : 0;
      }
      return state.pack;
    }

    function selection() {
      const name = (state.who === "self" ? user.username : friendName()) || "";
      if (state.product === "premium") {
        const plan = PLANS.find((item) => item.months === state.months) || PLANS[0];
        return {
          ok: Boolean(name),
          kind: "premium",
          recipient: name,
          months: plan.months,
          total: plan.total,
          label: "Premium на " + plan.months + " мес."
        };
      }
      const amount = currentAmount();
      const valid = amount >= STAR_MIN && amount <= STAR_MAX;
      const known = PACKS.find((pack) => pack.amount === amount);
      return {
        ok: Boolean(name) && valid,
        kind: "stars",
        recipient: name,
        amount: amount,
        total: known ? known.price : money(starCents(amount)),
        label: formatQty(amount) + " звёзд"
      };
    }

    function setSwitch(id, key, value) {
      const root = document.getElementById(id);
      let second = false;
      root.querySelectorAll("button").forEach((button) => {
        const on = button.dataset[key] === value;
        button.classList.toggle("on", on);
        if (on && button !== root.querySelector("button")) second = true;
      });
      root.classList.toggle("alt", second);
    }

    function render() {
      const stars = state.product === "stars";
      document.body.classList.toggle("premium", !stars);
      title.textContent = stars ? "Telegram Stars" : "Telegram Premium";
      section.textContent = stars ? "Количество" : "Срок";
      customLabel.hidden = !stars;
      setSwitch("product", "product", state.product);
      setSwitch("who", "who", state.who);
      renderRecipient();
      if (shownProduct !== state.product) {
        shownProduct = state.product;
        badge.replaceChildren(icon(stars ? "star" : "gem", "badge-ico"));
        const first = document.createElement("i");
        const second = document.createElement("i");
        first.className = "spark s1";
        second.className = "spark s2";
        badge.append(first, second);
        renderChoices();
        stage.classList.remove("playing");
        void stage.offsetWidth;
        stage.classList.add("playing");
      } else {
        paintSelection();
      }
      updatePay();
    }

    function updatePay() {
      const picked = selection();
      const total = picked.total + " USDT";
      if (due.textContent !== total) {
        due.textContent = total;
        due.classList.remove("tick");
        void due.offsetWidth;
        due.classList.add("tick");
      }
      pay.textContent = "Оплатить " + total;
      pay.disabled = !picked.ok;
    }

    function renderRecipient() {
      if (state.who === "friend") {
        if (shownWho === "friend" && document.getElementById("friendName")) return;
        shownWho = "friend";
        recipient.replaceChildren();
        const field = document.createElement("input");
        field.className = "field";
        field.id = "friendName";
        field.placeholder = "@username";
        field.autocomplete = "off";
        field.addEventListener("input", () => {
          note.textContent = "";
          note.classList.remove("show");
          updatePay();
        });
        recipient.appendChild(field);
        return;
      }
      shownWho = "self";
      const visible = [user.first_name, user.last_name].filter(Boolean).join(" ") || "Вы";
      const nick = user.username ? "@" + user.username : "без username";
      recipient.replaceChildren();
      const card = document.createElement("div");
      card.className = "profile";
      const avatar = document.createElement("div");
      avatar.className = "avatar";
      if (user.photo_url) {
        const photo = document.createElement("img");
        photo.src = user.photo_url;
        photo.alt = "";
        avatar.appendChild(photo);
      } else {
        avatar.textContent = visible.slice(0, 1).toUpperCase();
      }
      const copy = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = visible;
      const handle = document.createElement("div");
      handle.className = "handle";
      handle.textContent = nick;
      copy.append(name, handle);
      card.append(avatar, copy);
      recipient.appendChild(card);
    }

    function renderChoices() {
      choices.replaceChildren();
      choices.className = state.product === "stars" ? "grid" : "plans";
      if (state.product === "premium") {
        PLANS.forEach((plan) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "plan";
          button.dataset.months = String(plan.months);
          const copy = document.createElement("span");
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = plan.months + " " + monthWord(plan.months);
          const sub = document.createElement("span");
          sub.className = "sub";
          sub.textContent = plan.per + " USDT в месяц";
          copy.append(name, sub);
          const sum = document.createElement("span");
          sum.className = "sum";
          sum.textContent = plan.total + " USDT";
          button.append(icon("gem", "ico"), copy, sum);
          button.addEventListener("click", () => {
            state.months = plan.months;
            note.textContent = "";
            note.classList.remove("show");
            paintSelection();
            updatePay();
          });
          choices.appendChild(button);
        });
        paintSelection();
        return;
      }
      PACKS.forEach((pack) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";
        button.dataset.amount = String(pack.amount);
        const qty = document.createElement("div");
        qty.className = "qty";
        qty.append(icon("star", "ico"), document.createTextNode(formatQty(pack.amount)));
        const price = document.createElement("div");
        price.className = "price";
        price.textContent = pack.price + " USDT";
        button.append(qty, price);
        button.addEventListener("click", () => {
          state.pack = pack.amount;
          state.custom = "";
          custom.value = "";
          note.textContent = "";
          note.classList.remove("show");
          paintSelection();
          updatePay();
        });
        choices.appendChild(button);
      });
      paintSelection();
    }

    function paintSelection() {
      const amount = state.custom.trim() ? 0 : state.pack;
      choices.querySelectorAll(".card").forEach((card) => {
        card.classList.toggle("on", Number(card.dataset.amount) === amount);
      });
      choices.querySelectorAll(".plan").forEach((plan) => {
        plan.classList.toggle("on", Number(plan.dataset.months) === state.months);
      });
    }

    function monthWord(months) {
      return months === 3 ? "месяца" : "месяцев";
    }

    function burst() {
      const layer = document.getElementById("burst");
      layer.replaceChildren();
      for (let index = 0; index < 9; index += 1) {
        const bit = document.createElement("i");
        const angle = (Math.PI * 2 * index) / 9;
        bit.style.setProperty("--x", Math.cos(angle) * (54 + (index % 3) * 14) + "px");
        bit.style.setProperty("--y", (Math.sin(angle) * 28 - 46) + "px");
        bit.style.setProperty("--r", (index * 28) + "deg");
        layer.appendChild(bit);
      }
    }

    document.getElementById("product").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      state.product = button.dataset.product;
      note.textContent = "";
      note.classList.remove("show");
      render();
    });
    document.getElementById("who").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      state.who = button.dataset.who;
      note.textContent = "";
      note.classList.remove("show");
      render();
    });
    custom.addEventListener("input", () => {
      state.custom = custom.value;
      note.textContent = "";
      note.classList.remove("show");
      paintSelection();
      updatePay();
    });
    const topBar = document.querySelector(".top");
    const hero = document.querySelector(".hero");

    function showShop() {
      paywall.hidden = true;
      stage.hidden = false;
      checkout.hidden = false;
      topBar.hidden = false;
      hero.hidden = false;
      paynote.textContent = "";
      paynote.classList.remove("show");
      paywall.querySelectorAll(".method").forEach((button) => button.classList.remove("on"));
    }

    pay.addEventListener("click", () => {
      const picked = selection();
      if (!picked.ok) return;
      summary.textContent = picked.label + " для @" + picked.recipient + " · " + picked.total + " USDT";
      paynote.textContent = "";
      paynote.classList.remove("show");
      paywall.querySelectorAll(".method").forEach((button) => button.classList.remove("on"));
      stage.hidden = true;
      checkout.hidden = true;
      topBar.hidden = true;
      hero.hidden = true;
      paywall.hidden = false;
      burst();
    });
    document.getElementById("back").addEventListener("click", showShop);
    document.getElementById("theme").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });
    paywall.addEventListener("click", (event) => {
      const button = event.target.closest(".method");
      if (!button) return;
      const picked = selection();
      paywall.querySelectorAll(".method").forEach((item) => item.classList.toggle("on", item === button));
      const name = PAY_NAMES[button.dataset.pay] || button.dataset.pay;
      paynote.textContent = "Выбрано: " + name + ". Деньги не списываются.";
      paynote.classList.add("show");
      const payload = {
        kind: picked.kind,
        recipient: picked.recipient,
        total: picked.total,
        pay: button.dataset.pay
      };
      if (picked.kind === "premium") payload.months = picked.months;
      else payload.amount = picked.amount;
      if (tg && typeof tg.sendData === "function") {
        try { tg.sendData(JSON.stringify(payload)); } catch (error) {}
      }
    });
    render();
  </script>
</body>
</html>
